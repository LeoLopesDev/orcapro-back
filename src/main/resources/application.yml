spring:
  application:
    name: orca-pro

  datasource:
    url: ${DB_URL:jdbc:h2:mem:orcapro;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-para-uma-chave-longa-e-aleatoria}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  orcamento:
    validade-padrao-dias: 7
  public-url-base: ${PUBLIC_URL_BASE:http://localhost:5173/orcamento}

logging:
  level:
    com.orcamentos: INFO
